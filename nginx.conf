# Local nginx config for the Docker preview only — not used in production
# (production runs on GitHub Pages with its own routing).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed asset chunks
  location ~* \.(js|css|woff2|avif|webp|jpg|jpeg|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Sitemap, robots, OG image — short cache
  location ~ ^/(sitemap\.xml|robots\.txt|assets/og/.*) {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  # Routes prerender to <slug>/index.html. Serve as nicely as Pages does.
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }

  # Cleaner mime hints for AVIF + WebP
  types {
    image/avif avif;
    image/webp webp;
  }

  # Explicit 404 fallback
  error_page 404 /404.html;
  location = /404.html { internal; }
}

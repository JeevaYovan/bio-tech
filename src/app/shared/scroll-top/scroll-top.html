@if (isBrowser && hasScrollableContent()) {
  <button
    type="button"
    class="scroll-fab"
    [class.is-up]="!atTop()"
    [attr.aria-label]="atTop() ? 'Scroll to bottom' : 'Scroll to top'"
    (click)="onClick()">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <!-- Single chevron — flipped via CSS transform when in 'up' mode. -->
      <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
}

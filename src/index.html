<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <title>Rathika Biotech Products | Biodegradable Tableware, Coimbatore</title>
  <meta name="description" content="Biodegradable plates, bowls, cups, and spoons made from banana fiber, sugarcane bagasse, and rice husk. Crafted in Neelambur, Coimbatore. 100% natural, food-safe, compostable.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B4D3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking Inter load: preload as style, swap to stylesheet on
       arrival, fall back to a synchronous link if JS is disabled. -->
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  </noscript>
  <!-- Favicons + PWA — use the transparent PNG variants (logo.jpeg
       was JPEG, no transparency, blurry on hi-DPI). Sizes ensure
       Chrome / Safari / iOS / Android all pick the right asset. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The previous <link rel="preload"> for hero-tea-cup-haystack
       was wasted bandwidth — the asset is not actually rendered on
       any route. The real LCP hero image is now the WebGL/parallax
       hero, and below-the-fold images use NgOptimizedImage. -->
  <meta name="format-detection" content="telephone=yes">
  <noscript>
    <style>
      /* JS-disabled fallback: reveal-init elements are visible immediately
         so the page is readable without JavaScript. */
      .reveal-init { opacity: 1 !important; transform: none !important; transition: none !important; }
    </style>
  </noscript>
</head>
<body>
  <app-root>
    <noscript>
      <p>Rathika Biotech Products manufactures biodegradable tableware in Neelambur, Coimbatore. Phone: +91 90809 66792.</p>
    </noscript>
  </app-root>
</body>
</html>

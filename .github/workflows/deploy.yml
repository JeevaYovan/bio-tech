# Build, test, and deploy Rathika Biotech Products to GitHub Pages.
#
# Triggered by:
#   - push to main          → build + lhci gate + deploy to Pages
#   - pull_request to main  → build + lhci gate (no deploy)
#   - workflow_dispatch     → manual run from the Actions tab
#
# Required secrets (configure at Settings → Secrets and variables → Actions):
#   KLARO_NPM_TOKEN — npm auth token for the @klaro private registry at
#                     development.zubera.one. Without this, `npm ci` will
#                     401 on @klaro/ui, @klaro/utils, @klaro/theme.
#
# Required Pages settings (one-time, at Settings → Pages):
#   Source: GitHub Actions  (NOT "Deploy from a branch")

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions for actions/deploy-pages@v4.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to skip runs that finish before the
# in-progress one. Don't cancel in-progress because a half-deployed Pages
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # Build + Lighthouse CI gate. Runs on every push and PR.
  # ----------------------------------------------------------------------
  build:
    name: Build + Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Configure private @klaro npm registry
        run: |
          cat > "$HOME/.npmrc" <<'NPMRC'
          @klaro:registry=https://development.zubera.one/klaro-design-ui/~npm/
          //development.zubera.one/klaro-design-ui/~npm/:_authToken=${KLARO_NPM_TOKEN}
          NPMRC
          # Substitute the secret in (avoids leaking it in logs)
          sed -i "s|\${KLARO_NPM_TOKEN}|${KLARO_NPM_TOKEN}|" "$HOME/.npmrc"
        env:
          KLARO_NPM_TOKEN: ${{ secrets.KLARO_NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build (production, static prerender)
        run: npm run build

      - name: Verify build artefacts
        run: |
          test -f dist/rathika/browser/index.html      || (echo "❌ Missing index.html"; exit 1)
          test -f dist/rathika/browser/404.html        || (echo "❌ Missing 404.html"; exit 1)
          test -f dist/rathika/browser/.nojekyll       || (echo "❌ Missing .nojekyll"; exit 1)
          test -f dist/rathika/browser/CNAME           || (echo "❌ Missing CNAME"; exit 1)
          test -f dist/rathika/browser/sitemap.xml     || (echo "❌ Missing sitemap.xml"; exit 1)
          test -f dist/rathika/browser/robots.txt      || (echo "❌ Missing robots.txt"; exit 1)
          echo "✓ All required artefacts present"
          echo "Routes prerendered: $(find dist/rathika/browser -name 'index.html' | wc -l)"

      - name: Lighthouse CI gate
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          # Optional — set this secret to enable PR comments with the
          # Lighthouse scores. If unset, lhci still runs and asserts but
          # doesn't post to the PR.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rathika/browser

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ -d dist/rathika/browser ]; then
              echo "- Routes prerendered: $(find dist/rathika/browser -name 'index.html' | wc -l)"
              echo "- Total dist size: $(du -sh dist/rathika/browser | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------
  # Deploy to GitHub Pages. Only runs on push to main.
  # ----------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- Live URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- Custom domain (after DNS): https://rathika.in"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

# Build, test, and deploy Rathika Biotech Products to GitHub Pages.
#
# Triggered by:
#   - push to main          → build + lhci gate + deploy to Pages
#   - pull_request to main  → build + lhci gate (no deploy)
#   - workflow_dispatch     → manual run from the Actions tab
#
# Required secrets (configure at Settings → Secrets and variables → Actions):
#   KLARO_NPM_TOKEN — npm auth token for the @klaro private registry at
#                     development.zubera.one. Without this, `npm ci` will
#                     401 on @klaro/ui, @klaro/utils, @klaro/theme.
#
# Required Pages settings (one-time, at Settings → Pages):
#   Source: GitHub Actions  (NOT "Deploy from a branch")
#
# Repository variables (Settings → Variables → Actions):
#   DEPLOY_TARGET — set to "apex" once DNS is wired and rathika.in
#                   resolves to GitHub Pages. Default ("subpath" or
#                   unset) deploys to https://JeevaYovan.github.io/bio-tech/
#                   with assets prefixed at /bio-tech/ and no CNAME so
#                   the cert provisioner doesn't try to issue for an
#                   unresolved domain.
#                   Once DEPLOY_TARGET=apex is set, the build switches
#                   to baseHref=/ and writes a CNAME of "rathika.in"
#                   into the deployed output.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # Build + Lighthouse CI gate. Runs on every push and PR.
  # ----------------------------------------------------------------------
  build:
    name: Build + Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Configure private @klaro npm registry
        env:
          KLARO_NPM_TOKEN: ${{ secrets.KLARO_NPM_TOKEN }}
        run: |
          # Fail-fast with a clear message if the secret isn't set.
          if [ -z "$KLARO_NPM_TOKEN" ]; then
            echo "::error::KLARO_NPM_TOKEN secret is not set or empty."
            echo "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  Name:  KLARO_NPM_TOKEN"
            echo "  Value: the token from your local ~/.npmrc"
            exit 1
          fi

          # Write a clean ~/.npmrc with the token directly (no here-doc tricks).
          {
            printf '%s\n' "@klaro:registry=https://development.zubera.one/klaro-design-ui/~npm/"
            printf '//development.zubera.one/klaro-design-ui/~npm/:_authToken=%s\n' "$KLARO_NPM_TOKEN"
          } > "$HOME/.npmrc"
          echo "Wrote ~/.npmrc ($(wc -l < $HOME/.npmrc) lines, token redacted)."

          # Probe the registry with the token to verify it works BEFORE npm ci.
          # Saves debugging the cryptic E401 from npm if the token is wrong.
          probe_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $KLARO_NPM_TOKEN" \
            "https://development.zubera.one/klaro-design-ui/~npm/@klaro%2Fui" || echo "000")
          case "$probe_status" in
            200|304)
              echo "OK Registry probe returned HTTP $probe_status — auth verified."
              ;;
            401|403)
              echo "::error::Registry rejected the token (HTTP $probe_status)."
              echo "The KLARO_NPM_TOKEN secret value is wrong or expired. Generate a new"
              echo "one from the OneDev npm registry UI and update the GitHub secret."
              exit 1
              ;;
            *)
              echo "::warning::Registry probe returned HTTP $probe_status (unexpected)."
              echo "Continuing to npm ci — if it 401s, the token is the issue."
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "apex" ]; then
            echo "mode=apex"        >> "$GITHUB_OUTPUT"
            echo "base_href=/"      >> "$GITHUB_OUTPUT"
            echo "skip_cname=false" >> "$GITHUB_OUTPUT"
            echo "Building for apex domain (rathika.in)"
          else
            echo "mode=subpath"            >> "$GITHUB_OUTPUT"
            echo "base_href=/bio-tech/"    >> "$GITHUB_OUTPUT"
            echo "skip_cname=true"         >> "$GITHUB_OUTPUT"
            echo "Building for github.io subpath (preview)"
          fi

      - name: Build (production, static prerender)
        run: npm run build -- --base-href=${{ steps.target.outputs.base_href }}
        env:
          SKIP_CNAME: ${{ steps.target.outputs.skip_cname }}

      - name: Verify build artefacts
        run: |
          test -f dist/rathika/browser/index.html      || (echo "Missing index.html"; exit 1)
          test -f dist/rathika/browser/404.html        || (echo "Missing 404.html"; exit 1)
          test -f dist/rathika/browser/.nojekyll       || (echo "Missing .nojekyll"; exit 1)
          test -f dist/rathika/browser/sitemap.xml     || (echo "Missing sitemap.xml"; exit 1)
          test -f dist/rathika/browser/robots.txt      || (echo "Missing robots.txt"; exit 1)
          if [ "${{ steps.target.outputs.mode }}" = "apex" ]; then
            test -f dist/rathika/browser/CNAME         || (echo "Missing CNAME for apex deploy"; exit 1)
          fi
          echo "All required artefacts present"
          echo "Routes prerendered: $(find dist/rathika/browser -name 'index.html' | wc -l)"

      - name: Lighthouse CI gate
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rathika/browser

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Deploy target: \`${{ steps.target.outputs.mode }}\` (baseHref=\`${{ steps.target.outputs.base_href }}\`)"
            if [ -d dist/rathika/browser ]; then
              echo "- Routes prerendered: $(find dist/rathika/browser -name 'index.html' | wc -l)"
              echo "- Total dist size: $(du -sh dist/rathika/browser | cut -f1)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------
  # Deploy to GitHub Pages. Only runs on push to main.
  # ----------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- Live URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- Custom domain (after DNS + repo var DEPLOY_TARGET=apex): https://rathika.in"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
